; ============================================================
; PlatformIO Configuration — AgriGuardian AI ESP32 Node
; ============================================================
; This file allows building with PlatformIO CLI or PlatformIO IDE
; while keeping full compatibility with Arduino IDE (the .ino file
; is still the entry point).
;
; Quick start:
;   pio run                    # Compile
;   pio run -t upload          # Flash to ESP32
;   pio run -t uploadfs        # Upload SPIFFS filesystem
;   pio device monitor         # Serial monitor
;
; The MQTT_MAX_PACKET_SIZE build flag eliminates the need to
; manually patch PubSubClient.h (see SETUP_GUIDE.md).
; ============================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; ── Serial Monitor ────────────────────────────────────────
monitor_speed = 115200

; ── Library Dependencies (pinned versions) ────────────────
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    knolleary/PubSubClient@^2.8.0

; ── Build Flags ───────────────────────────────────────────
; Override PubSubClient's default 256-byte buffer at compile time
; so you don't need to manually edit the library source.
build_flags =
    -DMQTT_MAX_PACKET_SIZE=1024

; ── SPIFFS Filesystem ─────────────────────────────────────
; Required for offline telemetry buffering.
; Partition scheme with SPIFFS support.
board_build.partitions = default.csv
board_build.filesystem = spiffs

; ── Upload Settings ───────────────────────────────────────
upload_speed = 921600

; ── OTA Upload Target (optional) ──────────────────────────
; Uncomment and set the IP to upload via OTA instead of USB.
; upload_protocol = espota
; upload_port = 192.168.1.xxx
; upload_flags =
;     --auth=agriguardian-ota
